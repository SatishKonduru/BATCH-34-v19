<div class="container">
  <h2 mat-dialog-title>{{ data.title }}</h2>
  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onConfirm()">YES</button>
    <button mat-button (click)="onCancel()">No</button>
  </mat-dialog-actions>
</div>
